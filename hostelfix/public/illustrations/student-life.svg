<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ambient Light -->
  <circle cx="250" cy="200" r="140" fill="#ECFDF5" opacity="0.7" />
  <circle cx="340" cy="140" r="80" fill="#EEF2FF" opacity="0.7" />

  <!-- Central Mobile Smartphone Device for Student -->
  <g filter="url(#phoneShadow)" transform="translate(160, 40)">
    <!-- Phone Body -->
    <rect width="180" height="320" rx="28" fill="#0F172A" />
    <rect x="6" y="6" width="168" height="308" rx="22" fill="#FFFFFF" />

    <!-- Speaker Bar -->
    <rect x="65" y="14" width="50" height="4" rx="2" fill="#CBD5E1" />

    <!-- App Top Bar -->
    <rect x="6" y="24" width="168" height="45" fill="url(#emeraldGrad)" />
    <text x="20" y="52" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">HostelFix Mobile</text>
    <circle cx="155" cy="46" r="8" fill="#A7F3D0" />

    <!-- Card 1: Report Issue -->
    <rect x="18" y="80" width="144" height="60" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="38" cy="110" r="14" fill="#ECFDF5" />
    <text x="32" y="115" font-size="13">💡</text>
    <text x="60" y="104" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#0F172A">Room Light Damaged</text>
    <text x="60" y="118" font-family="system-ui, sans-serif" font-weight="500" font-size="9" fill="#10B981">Assigned • Tech on way</text>

    <!-- Card 2: Status Timeline -->
    <rect x="18" y="150" width="144" height="110" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="28" y="170" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#334155">Tracking Timeline</text>
    
    <!-- Timeline dots -->
    <circle cx="34" cy="190" r="5" fill="#10B981" />
    <line x1="34" y1="195" x2="34" y2="215" stroke="#10B981" stroke-width="2" />
    <text x="46" y="193" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#0F172A">Complaint Logged</text>

    <circle cx="34" cy="220" r="5" fill="#3B82F6" />
    <line x1="34" y1="225" x2="34" y2="240" stroke="#CBD5E1" stroke-width="2" />
    <text x="46" y="223" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#0F172A">Technician Dispatched</text>

    <circle cx="34" cy="245" r="5" fill="#CBD5E1" />
    <text x="46" y="248" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#94A3B8">Fix Verified by Student</text>

    <!-- Submit Button -->
    <rect x="18" y="270" width="144" height="30" rx="10" fill="url(#emeraldGrad)" />
    <text x="90" y="289" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" text-anchor="middle">+ New Request</text>
  </g>

  <!-- Floating Student Badge (Left) -->
  <g filter="url(#phoneShadow)" transform="translate(40, 150)">
    <rect width="105" height="75" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="30" cy="30" r="14" fill="#EEF2FF" />
    <text x="24" y="35" font-size="14">🎓</text>
    <text x="50" y="28" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#0F172A">Student ID</text>
    <text x="50" y="40" font-family="system-ui, sans-serif" font-size="9" fill="#6366F1">Hostel BH-1</text>
    <rect x="14" y="52" width="77" height="12" rx="6" fill="#ECFDF5" />
    <text x="52" y="61" font-family="system-ui, sans-serif" font-weight="700" font-size="7.5" fill="#059669" text-anchor="middle">ACTIVE RESIDENT</text>
  </g>

  <!-- Floating Checkmark Pill (Right) -->
  <g filter="url(#phoneShadow)" transform="translate(360, 200)">
    <rect width="100" height="60" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="28" cy="30" r="12" fill="#ECFDF5" />
    <path d="M 23 30 L 27 34 L 34 26" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
    <text x="46" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#0F172A">100% Digital</text>
    <text x="46" y="40" font-family="system-ui, sans-serif" font-size="8" fill="#64748B">No paper forms</text>
  </g>
</svg>
