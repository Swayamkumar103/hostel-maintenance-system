<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="skyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="chartBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="dashShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <circle cx="250" cy="200" r="140" fill="#F5F3FF" opacity="0.7" />
  <circle cx="160" cy="120" r="80" fill="#EFF6FF" opacity="0.7" />

  <!-- Main Analytics Window -->
  <g filter="url(#dashShadow)" transform="translate(100, 60)">
    <rect width="300" height="240" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

    <!-- Window Header -->
    <rect width="300" height="42" rx="20" fill="#0F172A" />
    <rect y="22" width="300" height="20" fill="#0F172A" />
    <circle cx="24" cy="21" r="5" fill="#EF4444" />
    <circle cx="40" cy="21" r="5" fill="#F59E0B" />
    <circle cx="56" cy="21" r="5" fill="#10B981" />
    <text x="280" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#94A3B8" text-anchor="end">WARDEN CONTROL TOWER</text>

    <!-- Mini KPI Stat Badges Inside Window -->
    <rect x="20" y="56" width="76" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="28" y="72" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#64748B">SLA Rate</text>
    <text x="28" y="88" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#10B981">99.4%</text>

    <rect x="110" y="56" width="76" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="118" y="72" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#64748B">Resolved</text>
    <text x="118" y="88" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#3B82F6">248</text>

    <rect x="200" y="56" width="80" height="40" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
    <text x="208" y="72" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#DC2626">Escalated</text>
    <text x="208" y="88" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#EF4444">02</text>

    <!-- Bar Chart Graphic -->
    <g transform="translate(30, 115)">
      <!-- Baseline -->
      <line x1="0" y1="100" x2="240" y2="100" stroke="#CBD5E1" stroke-width="1" />
      <line x1="0" y1="65" x2="240" y2="65" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="0" y1="30" x2="240" y2="30" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3 3" />

      <!-- Bars with Gradients -->
      <rect x="15" y="45" width="22" height="55" rx="5" fill="url(#chartBarGrad)" />
      <rect x="55" y="25" width="22" height="75" rx="5" fill="url(#purpleGrad)" />
      <rect x="95" y="50" width="22" height="50" rx="5" fill="url(#chartBarGrad)" />
      <rect x="135" y="15" width="22" height="85" rx="5" fill="url(#skyGrad2)" />
      <rect x="175" y="35" width="22" height="65" rx="5" fill="url(#chartBarGrad)" />

      <!-- Trend Wave Line -->
      <path d="M 26 40 Q 66 10 106 35 T 186 20" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
      <circle cx="186" cy="20" r="4" fill="#F59E0B" />
    </g>
  </g>

  <!-- Floating Shield (Left bottom) -->
  <g filter="url(#dashShadow)" transform="translate(60, 260)">
    <circle cx="36" cy="36" r="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <path d="M 36 20 L 50 26 C 50 38 43 47 36 52 C 29 47 22 38 22 26 Z" fill="url(#purpleGrad)" />
    <path d="M 32 36 L 35 39 L 41 33" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Floating Escalation Radar Badge (Right top) -->
  <g filter="url(#dashShadow)" transform="translate(360, 30)">
    <rect width="110" height="55" rx="14" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5" />
    <circle cx="28" cy="28" r="10" fill="#FEE2E2" />
    <circle cx="28" cy="28" r="4" fill="#EF4444" />
    <text x="46" y="24" font-family="system-ui, sans-serif" font-weight="800" font-size="9" fill="#991B1B">SLA Radar</text>
    <text x="46" y="38" font-family="system-ui, sans-serif" font-size="8" fill="#64748B">Real-time alerts</text>
  </g>
</svg>
