<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <filter id="gearShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E293B" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient Light -->
  <circle cx="250" cy="200" r="140" fill="#FEF3C7" opacity="0.6" />
  <circle cx="160" cy="140" r="90" fill="#DBEAFE" opacity="0.6" />

  <!-- Background Big Gear -->
  <g fill="#E2E8F0" opacity="0.8">
    <circle cx="340" cy="150" r="65" />
    <circle cx="340" cy="150" r="30" fill="#FFFFFF" />
  </g>

  <!-- Main Center Shield / Console -->
  <g filter="url(#gearShadow)">
    <rect x="130" y="70" width="240" height="260" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Top Header of Terminal -->
    <rect x="130" y="70" width="240" height="52" rx="24" fill="url(#amberGrad)" />
    <rect x="130" y="100" width="240" height="22" fill="url(#amberGrad)" />
    <circle cx="160" cy="96" r="6" fill="#FDE68A" />
    <circle cx="180" cy="96" r="6" fill="#FDE68A" opacity="0.6" />
    <circle cx="200" cy="96" r="6" fill="#FDE68A" opacity="0.4" />
    <text x="330" y="102" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="end">TECH CONSOLE</text>

    <!-- Checklist Items -->
    <rect x="155" y="145" width="24" height="24" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" />
    <path d="M 160 157 L 165 162 L 174 152" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" />
    <rect x="190" y="150" width="120" height="8" rx="4" fill="#334155" />
    <rect x="190" y="163" width="70" height="6" rx="3" fill="#94A3B8" />

    <rect x="155" y="195" width="24" height="24" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
    <circle cx="167" cy="207" r="4" fill="#3B82F6" />
    <rect x="190" y="200" width="140" height="8" rx="4" fill="#334155" />
    <rect x="190" y="213" width="90" height="6" rx="3" fill="#94A3B8" />

    <rect x="155" y="245" width="24" height="24" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
    <path d="M 160 257 L 165 262 L 174 252" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
    <rect x="190" y="250" width="110" height="8" rx="4" fill="#334155" />
    <rect x="190" y="263" width="60" height="6" rx="3" fill="#94A3B8" />

    <!-- Status Button -->
    <rect x="155" y="290" width="190" height="24" rx="8" fill="#F1F5F9" />
    <text x="250" y="306" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#64748B" text-anchor="middle">⚡ Priority Dispatch Ready</text>
  </g>

  <!-- Floating Adjustable Wrench -->
  <g filter="url(#gearShadow)" transform="rotate(-30 110 250)">
    <rect x="80" y="235" width="95" height="18" rx="6" fill="url(#blueGrad)" />
    <circle cx="75" cy="244" r="20" fill="url(#blueGrad)" />
    <rect x="65" y="238" width="18" height="12" rx="2" fill="#FFFFFF" />
    <circle cx="170" cy="244" r="6" fill="#FFFFFF" />
  </g>

  <!-- Floating SLA Clock Badge -->
  <g filter="url(#gearShadow)" transform="translate(320, 240)">
    <circle cx="50" cy="50" r="42" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="50" cy="50" r="34" fill="#FEF3C7" />
    <line x1="50" y1="50" x2="50" y2="30" stroke="#D97706" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="50" x2="65" y2="50" stroke="#D97706" stroke-width="3" stroke-linecap="round" />
    <circle cx="50" cy="50" r="4" fill="#B45309" />
    <rect x="25" y="98" width="50" height="16" rx="8" fill="#D97706" />
    <text x="50" y="110" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" text-anchor="middle">SLA TIMER</text>
  </g>
</svg>
