    <path d="M 40 55 L 47 62 L 62 46" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Content Lines -->
    <rect x="22" y="96" width="56" height="6" rx="3" fill="#E2E8F0" />
    <rect x="30" y="108" width="40" height="5" rx="2.5" fill="#F1F5F9" />
  </g>

  <!-- Sparkles -->
  <path d="M 70 120 Q 75 125 80 120 Q 75 115 70 120 Z" fill="#F59E0B" />
  <path d="M 230 70 Q 235 75 240 70 Q 235 65 230 70 Z" fill="#10B981" />
