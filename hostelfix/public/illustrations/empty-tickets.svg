    <!-- Board -->
    <rect width="100" height="135" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <!-- Clip -->
    <rect x="30" y="-10" width="40" height="18" rx="6" fill="#3B82F6" />
    <circle cx="50" cy="-2" r="4" fill="#FFFFFF" />

