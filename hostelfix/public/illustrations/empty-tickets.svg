<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="emptyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <circle cx="150" cy="120" r="85" fill="#EFF6FF" />
  <circle cx="85" cy="80" r="16" fill="#FEF3C7" opacity="0.6" />
  <circle cx="225" cy="160" r="12" fill="#D1FAE5" opacity="0.7" />

  <!-- Clipboard -->
